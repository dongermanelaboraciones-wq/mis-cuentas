<body>
<style>
/* Concepto: app clara y juguetona. Una sola paleta luminosa (sin modo oscuro, a propósito).
   Formas: botones principales en píldora, categorías en cuadrado suave, teclado en círculos, bancos con una esquina "pico". */
:root{
  --bg:#F2F4FF; --surface:#FFFFFF; --soft:#F6F7FF; --line:#E4E8FA; --ink:#1E2447; --muted:#6A7194;
  --coral:#FF5A6E; --mint:#18C48C; --sky:#3D8BFF; --violet:#7C5CFF; --sun:#FFB020;
  --g-gasto:linear-gradient(135deg,#FF7A7A,#FF4D6D); --g-ingreso:linear-gradient(135deg,#34D9A5,#12B886);
  --g-traspaso:linear-gradient(135deg,#5BB1FF,#3B6BFF); --g-hero:linear-gradient(135deg,#6C5CFF 0%,#8E5CFF 45%,#3D8BFF 100%);
  --g-sun:linear-gradient(135deg,#FFC94D,#FF9F1C); --g-fab:linear-gradient(135deg,#8E5CFF,#3D8BFF);
  --santander:#E5383B; --caixa:#2D7FF9; --revolut:#8F5BE8; --otro:#8A93AD; --b100:#14B8A6;
  --sh-s:0 2px 8px rgba(52,60,130,.10); --sh-m:0 10px 28px rgba(52,60,130,.14);
  --font:"Nunito","SF Pro Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior:none}
html{background:#F2F4FF}
/* El degradado va en su propia capa fija: background-attachment:fixed hace temblar la pantalla en iOS */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#E9EDFF 0,#F6F7FF 320px,#F2F4FF 100%)}
body{background:transparent;color:var(--ink);font:500 15px/1.45 var(--font);padding-inline:16px;padding-block:14px 130px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px} h2{font-size:18px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .hint{font-size:13px;color:var(--muted)}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-width:0}.between{justify-content:space-between}
.good{color:#0E9F6E}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top small{display:block;color:var(--muted);font-weight:600}
.round{width:46px;height:46px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-s);display:grid;place-items:center;transition:transform .15s}
.round:active{transform:scale(.9)}
.round svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* tarjeta principal y acciones */
.hero{background:var(--g-hero);color:#fff;border-radius:30px;padding:22px 22px 54px;box-shadow:0 14px 34px rgba(108,92,255,.38);position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}
.hero:before{width:180px;height:180px;right:-50px;top:-70px}.hero:after{width:110px;height:110px;right:70px;bottom:-60px}
.hero .label{color:rgba(255,255,255,.8)}
.hero .total{font-size:44px;font-weight:900;line-height:1.1;letter-spacing:-.02em;margin:6px 0 2px}
.hero .sub{font-weight:700;color:rgba(255,255,255,.88)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-34px 14px 0;position:relative;z-index:2}
.act{height:62px;border-radius:99px;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,box-shadow .15s}
.act i{font-style:normal;font-size:22px;line-height:1}
.act:active{transform:scale(.94) translateY(2px)}
.act.gasto{background:var(--g-gasto);box-shadow:0 10px 20px rgba(255,77,109,.40)}
.act.ingreso{background:var(--g-ingreso);box-shadow:0 10px 20px rgba(18,184,134,.38)}
.act.traspaso{background:var(--g-traspaso);box-shadow:0 10px 20px rgba(59,107,255,.38)}

/* tarjetas de banco */
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 18px;margin-inline:-16px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.bcard{flex:0 0 158px;scroll-snap-align:start;background:var(--g);color:#fff;border-radius:24px 24px 24px 8px;padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:112px;box-shadow:0 10px 22px var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.bcard:active{transform:scale(.95)}
.bcard:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.16);right:-24px;top:-24px}
.bcard .bn{font-weight:800;font-size:14px;opacity:.95}
.bcard .ba{font-weight:900;font-size:22px;margin-top:auto;letter-spacing:-.01em}
.bcard .bh{font-size:11px;font-weight:700;opacity:.8}

/* tarjetas generales */
.card{background:var(--surface);border-radius:26px;padding:18px;box-shadow:var(--sh-m);min-width:0}
.card.sun{background:var(--g-sun);color:#4A2B00;box-shadow:0 12px 26px rgba(255,159,28,.38)}
.card.sun .label,.card.sun .hint{color:rgba(74,43,0,.75)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{border-radius:20px;padding:12px 10px;background:var(--bg2);min-width:0}
.stat .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;margin-bottom:8px;background:var(--c)}
.stat b{display:block;font-weight:900;font-size:18px;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmp>div{border-radius:20px;padding:14px;min-width:0}
.cmp .a{background:#FFF1F3}.cmp .b{background:#E6FAF3}
.cmp b{display:block;font-weight:900;font-size:26px;letter-spacing:-.01em;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.warn{background:#FFF1D6;color:#9A5B00}.pill.ok{background:#DDF8EC;color:#0B7A55}
.btn{border-radius:99px;padding:14px 22px;font-weight:900;color:#fff;background:var(--g-fab);box-shadow:0 10px 20px rgba(124,92,255,.35);min-height:50px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.soft{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.white{background:#fff;color:#7A4A00;box-shadow:0 6px 14px rgba(120,70,0,.2)}
.btn.small{padding:9px 16px;min-height:40px;font-size:14px}
.btn.green{background:var(--g-ingreso);box-shadow:0 10px 20px rgba(18,184,134,.38)}
.btn.red{background:var(--g-gasto);box-shadow:0 10px 20px rgba(255,77,109,.38)}
.btn.block{width:100%}
.btn.ghostred{background:#FFF1F3;color:#D93A55;box-shadow:none}
.btn[disabled]{opacity:.5;box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:99px;padding:9px 15px;font-weight:800;font-size:14px;background:var(--surface);box-shadow:var(--sh-s);min-height:40px;display:inline-flex;align-items:center;gap:7px;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:4px 16px 10px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* historial */
.day{font-size:13px;font-weight:900;color:var(--muted);margin:6px 4px 8px;text-transform:capitalize}
.mov{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:20px;background:var(--surface);box-shadow:var(--sh-s);margin-bottom:8px;transition:transform .12s}
.mov:active{transform:scale(.98)}
.em{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:23px;background:var(--bg2)}
.mov .c{font-weight:800;overflow-wrap:anywhere}
.mov .sub{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-weight:700}
.mov .a{font-weight:900;font-size:16px;text-align:right}
.search{width:100%;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:none;border-radius:99px;padding:13px 18px;min-height:48px;box-shadow:var(--sh-s)}
.empty{text-align:center;padding:30px 14px;color:var(--muted);font-weight:700}

/* cobros */
.cob{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--surface);border-radius:24px;padding:14px;box-shadow:var(--sh-m);margin-bottom:12px;align-items:center}
.cob .amt{font-weight:900;font-size:24px}

/* gráficos */
.bars{width:100%;height:auto;display:block}
.bars text{fill:var(--muted);font:700 11px var(--font)}.bars .sel{fill:var(--ink);font-weight:900}
.hbar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) auto;gap:10px;align-items:center;font-size:13px;font-weight:700;padding:5px 0}
.hbar .track{height:12px;border-radius:8px;background:var(--soft);overflow:hidden}.hbar .fill{height:100%;border-radius:8px;background:var(--c)}
.hbar .nm{overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:13px;font-weight:700}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}

/* barra inferior */
nav.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),536px);background:#fff;border-radius:32px;box-shadow:0 12px 34px rgba(52,60,130,.25);padding:8px 10px;z-index:20;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center}
nav.bar .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:18px;font-size:11px;font-weight:800;color:var(--muted);min-height:50px;position:relative}
nav.bar .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bar .tab[aria-current="page"]{color:var(--violet);background:#F0EBFF}
nav.bar .fab{width:66px;height:66px;border-radius:50%;background:var(--g-fab);margin:-34px auto 0;display:grid;place-items:center;box-shadow:0 12px 24px rgba(124,92,255,.5);transition:transform .15s;border:4px solid #fff}
nav.bar .fab:active{transform:scale(.9) rotate(90deg)}
nav.bar .fab svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}
.badge{position:absolute;top:0;right:12px;background:var(--coral);color:#fff;border-radius:99px;font-size:10px;font-weight:900;padding:1px 6px;min-width:18px;text-align:center}

/* hojas */
.scrim{position:fixed;inset:0;background:rgba(30,36,71,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:96%;overflow-y:auto;border-radius:30px 30px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sheet>*{flex:none}
.sheet.pop{animation:slide .28s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{transform:translateY(60px);opacity:0}}
@media(min-width:620px){.scrim{align-items:center}.sheet{border-radius:30px;max-height:92%}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border-radius:99px;padding:11px 4px;font-weight:900;background:var(--surface);color:var(--muted);box-shadow:var(--sh-s);min-height:46px;transition:transform .12s}
.seg button:active{transform:scale(.94)}
.seg button[aria-pressed="true"]{color:#fff;box-shadow:0 8px 18px var(--sh);background:var(--g)}
.amount{background:var(--surface);border-radius:26px;padding:14px 18px;box-shadow:var(--sh-s);text-align:center}
.amount .show{font-size:46px;font-weight:900;letter-spacing:-.02em;color:var(--tc);overflow-wrap:anywhere;line-height:1.15}
.amount .sum{font-size:14px;font-weight:800;color:var(--muted);min-height:20px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{border-radius:50%;aspect-ratio:1;justify-self:center;width:100%;max-width:72px;background:var(--surface);box-shadow:0 5px 12px rgba(52,60,130,.14);font-size:24px;font-weight:900;display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.key:active{transform:scale(.88);box-shadow:0 1px 3px rgba(52,60,130,.18)}
.key.op{background:#EEE9FF;color:var(--violet)}.key.eq{background:var(--g-sun);color:#fff;box-shadow:0 6px 14px rgba(255,159,28,.4)}
.key.clr{background:#FFF1F3;color:#E0405A;font-size:19px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.field>.lb{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
input[type=text],input[type=date],input[type=number],select{width:100%;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid transparent;border-radius:18px;padding:13px 16px;min-height:50px;box-shadow:var(--sh-s)}
input:focus,select:focus{border-color:var(--sky)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:22px;padding:12px 4px 10px;background:var(--bgc);color:var(--ink);font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;transition:transform .12s;min-height:84px;justify-content:center;text-align:center;line-height:1.15}
.tile i{font-style:normal;font-size:26px;line-height:1}
.tile:active{transform:scale(.93)}
.tile[aria-pressed="true"]{border-color:var(--c);background:#fff;box-shadow:0 8px 18px var(--shc);animation:bounce .3s}
@keyframes bounce{40%{transform:scale(1.08)}}
.bankpick{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:8px}
.bankpick button{border-radius:22px 22px 22px 8px;padding:12px 4px;font-weight:900;font-size:13px;min-height:58px;background:var(--surface);box-shadow:var(--sh-s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:transform .12s;color:var(--ink)}
.bankpick button .dot{width:14px;height:14px}
.bankpick button:active{transform:scale(.93)}
.bankpick button[aria-pressed="true"]{background:var(--g);color:#fff;box-shadow:0 8px 18px var(--sh)}
.bankpick button[aria-pressed="true"] .dot{background:#fff}
.bankpick.big button{min-height:76px;font-size:15px}
.arrow{text-align:center;font-weight:900;color:var(--muted);font-size:20px;margin:-6px 0}
.switch{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--sh-s);font-weight:800;text-align:left;width:100%}
.switch .tr{flex:none;width:52px;height:30px;border-radius:99px;background:#D6DAEE;position:relative;transition:background .2s}
.switch .tr:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-pressed="true"] .tr{background:var(--sun)}.switch[aria-pressed="true"] .tr:after{transform:translateX(22px)}
.save{height:60px;font-size:17px;border-radius:99px;color:#fff;font-weight:900;background:var(--g);box-shadow:0 12px 24px var(--sh);width:100%;transition:transform .12s}
.save:active{transform:scale(.97)}
.banner{background:#FFF1D6;color:#8A5200;border-radius:18px;padding:12px 14px;font-weight:800;font-size:13px}
.banner.err{background:#FFE3E8;color:#B3243F}
.install{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:24px;padding:16px;box-shadow:var(--sh-m)}
.install .ic{font-size:30px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 14px 12px 18px;border-radius:99px;font-weight:800;z-index:60;max-width:92%;display:flex;gap:14px;align-items:center;box-shadow:0 12px 28px rgba(30,36,71,.4);animation:up .25s}
.toast button{color:#FFD166;font-weight:900;padding:4px 8px}
@keyframes up{from{opacity:0;transform:translate(-50%,14px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<nav class="bar" id="nav"></nav>

const CATS_I={"Sueldo":["💼","#10B981"],"Aporte hipoteca":["🏦","#6C7BFF"],"Paro":["📋","#0EA5E9"],"Extras":["🎉","#F59E0B"]};
const TYPE={g:{n:"Gasto",g:"var(--g-gasto)",c:"#FF4D6D",sh:"rgba(255,77,109,.38)"},i:{n:"Ingreso",g:"var(--g-ingreso)",c:"#12B886",sh:"rgba(18,184,134,.38)"},t:{n:"Traspaso",g:"var(--g-traspaso)",c:"#3B6BFF",sh:"rgba(59,107,255,.38)"}};
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

const eur=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const eur0=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const fmt=n=>n==null||isNaN(n)?"—":eur.format(n);
const fmt0=n=>eur0.format(n);
const r2=n=>Math.round(n*100)/100;
const pad=n=>String(n).padStart(2,"0");
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return isoDate(new Date())}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return isoDate(d)}
function parseAmount(s){
  s=String(s==null?"":s).replace(/\s/g,"").replace(/,/g,".").replace(/€/g,"");
  if(!s||!/^[0-9+\-.]+$/.test(s))return null;
  const t=s.match(/[+-]?[0-9]*\.?[0-9]+/g); if(!t||t.join("")!==s.replace(/^\+/,""))return null;
  let sum=0; for(const x of t){const v=parseFloat(x); if(isNaN(v))return null; sum+=v}
  return r2(sum);
}

let dbh=null,queue=Promise.resolve(),pending=0;
const LS="micuentas.v1";
function lsRead(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify({config:S.config,months:S.months}))}catch(e){toast("No se pudo guardar en este móvil. Revisa el espacio.")}}
function enqueue(fn){pending++;queue=queue.then(fn).catch(e=>{toast(e&&e.code==="invalid_argument"?"No tienes permiso para guardar aquí.":"No se pudo guardar. Inténtalo otra vez.")}).then(()=>{pending--});return queue}
function saveMonth(k){ if(dbh){const items=clone(S.months[k]||[]);return enqueue(()=>dbh.doc("movs/"+k).set({items}))} lsWrite(); return Promise.resolve()}

async function boot(){
  try{ dbh=(window.claude&&window.claude.use)?await window.claude.use("db"):null }catch(e){dbh=null}
  if(dbh){
    S.mode="db";
    dbh.doc("config/main").onSnapshot(s=>{if(pending>0)return;if(s.exists){S.config=Object.assign(DEFAULT_CFG(),S.config,s.data())}S.loaded=true;render()},()=>{});
    dbh.collection("movs").onSnapshot(q=>{if(pending>0)return;const m={};q.docs.forEach(d=>{m[d.id]=(d.data().items||[])});S.months=m;S.loaded=true;render()},()=>{});
  }else{
    S.mode="local"; const d=lsRead(); if(d){S.config=Object.assign(DEFAULT_CFG(),d.config);S.months=d.months||{}} S.loaded=true; render();

/* ---------- cálculos ---------- */
const all=()=>Object.keys(S.months).sort().flatMap(k=>S.months[k]);
function balances(){
  const b={Santander:0,Caixa:0,Revolut:0,Otro:0,B100:0}, sd=S.config.saldos||{};
  for(const k in b)b[k]=+sd[k]||0;
  const base=S.config.saldoFecha||"0000";
  for(const x of all()){
    const m=x.m||0;
    if(x.h){ if(x.t==="g"&&x.cb&&x.cd&&x.cdn&&x.cdb&&m)b[x.cdb]=(b[x.cdb]||0)+m; continue }
    if(x.t==="i")b[x.b]=(b[x.b]||0)+m;
    else if(x.t==="g"){b[x.b]=(b[x.b]||0)-m; if(x.cb&&x.cd&&x.cdb)b[x.cdb]=(b[x.cdb]||0)+m}
    else if(x.t==="t"){b[x.de]=(b[x.de]||0)-m; b[x.a]=(b[x.a]||0)+m}
  }
  return b;
}
const isReal=x=>x.t==="g"&&!x.cb&&x.m!=null;
function monthStats(k){
  const it=S.months[k]||[]; let ing=0,fix=0,gas=0,hog=0;
  for(const x of it){
    if(x.t==="i"&&x.m!=null){ing+=x.m; if(x.k==="Sueldo"||x.k==="Aporte hipoteca")fix+=x.m}
    if(isReal(x)){gas+=x.m; if(x.k==="Aportación hogar")hog+=x.m}
  }
  return {ing:r2(ing),fix:r2(fix),gas:r2(gas),hog:r2(hog),per:r2(gas-hog),net:r2(ing-gas)};
}
const pendientes=()=>all().filter(x=>x.t==="g"&&x.cb&&!x.cd&&x.m!=null).sort((a,b)=>b.f.localeCompare(a.f));
const cobrados=()=>all().filter(x=>x.t==="g"&&x.cb&&x.cd).sort((a,b)=>b.f.localeCompare(a.f));
function plan(){
  const now=today().slice(0,7), ks=Object.keys(S.months).filter(k=>k<now).sort();
  const last3=ks.slice(-3), last6=ks.slice(-6);
  const avg=(arr,f)=>arr.length?arr.reduce((s,k)=>s+f(monthStats(k)),0)/arr.length:0;
  const fijo=avg(last3,s=>s.fix), per=S.config.gastoEst!=null?+S.config.gastoEst:avg(last6,s=>s.per);
  const ha=+S.config.hogarActual||0, hn=+S.config.hogarNuevo||0;
  return {fijo:r2(fijo),per:r2(per),ha,hn,antes:r2(fijo-ha-per),despues:r2(fijo-hn-per),auto:S.config.gastoEst==null,n3:last3.length,n6:last6.length};
}

  if(toastObj)h+=`<div class="toast" role="status"><span>✓ ${esc(toastObj.msg)}</span>${toastObj.undo?`<button id="undoBtn">Deshacer</button>`:""}</div>`;
  const prev=document.querySelector(".sheet"); const st=prev?prev.scrollTop:0;
  const ae=document.activeElement, keepId=ae&&ae.id, selS=ae&&ae.selectionStart;
  $("#layer").innerHTML=h; popNext=false;
  const nw=document.querySelector(".sheet"); if(nw&&prev)nw.scrollTop=st;
  if(sheet&&sheet.kind==="mov")updateAmountUI();
  if(sheet&&keepId){const e=document.getElementById(keepId);if(e&&e.tagName!=="BUTTON"){e.focus();try{e.setSelectionRange(selS,selS)}catch(_){}}}
  if(sheet&&(sheet.kind==="bal")&&!keepId){const v=$("#bV");if(v){v.focus();v.select()}}
}

/* ---------- copia de seguridad ---------- */
function exportJSON(){return JSON.stringify({app:"mis-cuentas",version:1,exportado:new Date().toISOString(),config:S.config,months:S.months})}
async function doExport(){
  const txt=exportJSON(), name="mis-cuentas-"+today()+".json";
  try{
    const file=new File([txt],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Copia de Mis Cuentas"});markBackup();return}
  }catch(e){if(e&&e.name==="AbortError")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);markBackup();sheet.msg="Copia guardada: "+name}catch(e){sheet.msg="No se pudo guardar el archivo. Usa «Copiar como texto»."}
  renderLayer();
}
function markBackup(){S.config.backupFecha=today();saveConfig();if(sheet&&sheet.kind==="cfg"){sheet.msg="Copia hecha.";renderLayer()}}
async function applyImport(d){
  S.months=d.months||{}; S.config=Object.assign(DEFAULT_CFG(),d.config||{},{inicializado:true});
  if(dbh){const ks=Object.keys(S.months);await Promise.all([saveConfig(),...ks.map(saveMonth)])}else lsWrite();
}
let importData=null;
function handleFile(file){
  if(!file)return; const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result); if(!d||typeof d.months!=="object"||!d.config)throw 0;
      importData=d;
      if(all().length>0){if(!sheet||sheet.kind!=="cfg"){sheet={kind:"cfg"};popNext=true} sheet.pendingImport=true;renderLayer()}
      else{await applyImport(d);sheet=null;tab="inicio";render();toast("Datos importados")}
    }catch(e){toast("Ese archivo no es una copia de Mis Cuentas")}
  };
  r.readAsText(file);
}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-mes],.scrim"); if(!t)return;
  if(t.classList.contains("scrim")){if(e.target===t&&sheet){readFields();sheet=null;renderLayer()}return}
  const d=t.dataset;
  if(t.id==="undoBtn"){const fn=toastObj&&toastObj.undo;toastObj=null;renderLayer();if(fn)await fn();toast("Deshecho");return}
  if(d.tab){tab=d.tab;sheet=null;render();window.scrollTo(0,0);return}
  if(t.id==="addbtn"){openSheet();return}
  if(d.new){openSheet(null,d.new);return}
  if(d.edit){openSheet(d.edit);return}
  if(d.f){const [g,v]=d.f.split(":");filt[g]=v;render();return}
  if(d.m){filt.m=d.m;render();return}
  if(d.res||d.mes){resMes=d.res||d.mes;render();return}
  if(d.cfg){sheet={kind:"cfg"};popNext=true;renderLayer();return}
  if(d.fix){sheet={kind:"bal",bank:d.fix,val:String(r2(balances()[d.fix])).replace(".",","),err:null};popNext=true;renderLayer();return}
  if(d.import){$("#impFile").value="";$("#impFile").click();return}
  if(d.init){sheet={kind:"init",vals:{}};popNext=true;renderLayer();return}
  if(t.id==="gEstSave"){const v=parseAmount($("#gEst").value);if(v!=null){S.config.gastoEst=v;await saveConfig();render();toast("Estimación guardada")}return}
  if(t.id==="gEstAuto"){S.config.gastoEst=null;await saveConfig();render();return}
  if(t.id==="togCob"){showCob=!showCob;render();return}
  if(t.id==="hideInstall"){try{localStorage.setItem("micuentas.install","1")}catch(_){}render();return}
  if(t.id==="doInstall"&&installEvt){installEvt.prompt();installEvt=null;render();return}
  if(d.cobrado){const x=findItem(d.cobrado);if(x){sheet={kind:"cob",id:x.id};popNext=true;renderLayer()}return}
  if(!sheet)return;
  if(t.id==="sClose"){readFields();sheet=null;renderLayer();return}
  if(sheet.kind==="cob"&&d.cb){const x=findItem(sheet.id);x.cd=true;x.cdn=true;x.cdb=d.cb;x.cdf=today();const k=ym(x.f);sheet=null;await saveMonth(k);render();toast("Cobrado, sumado a "+BLABEL[d.cb],async()=>{x.cd=false;delete x.cdn;delete x.cdb;delete x.cdf;await saveMonth(k);render()});return}
  if(sheet.kind==="bal"&&t.id==="bSave"){
    const v=parseAmount($("#bV").value); if(v==null){sheet.err="Importe no válido";renderLayer();return}
    const k=sheet.bank,cur=balances()[k]; S.config.saldos[k]=r2((+S.config.saldos[k]||0)+(v-cur)); sheet=null; await saveConfig(); render(); toast("Saldo actualizado"); return;
  }
  if(sheet.kind==="init"&&t.id==="iSave"){
    const vals={};for(const b of["Santander","Caixa","Revolut","B100"]){const raw=$("#i_"+b).value.trim();const v=raw===""?0:parseAmount(raw);if(v==null){sheet.vals[b]=raw;sheet.err="Revisa el saldo de "+BLABEL[b];renderLayer();return}vals[b]=v}
    S.config.saldos=vals;S.config.saldoFecha=today();S.config.inicializado=true;sheet=null;await saveConfig();render();toast("Listo. Ya puedes apuntar movimientos");return;
  }
  if(sheet.kind==="cfg"){
    if(t.id==="cSave"){const a=parseAmount($("#cHA").value),n=parseAmount($("#cHN").value);if(a==null||n==null){sheet.msg="Revisa los importes";renderLayer();return}S.config.hogarActual=a;S.config.hogarNuevo=n;S.config.hogarDesde=$("#cHD").value;await saveConfig();sheet=null;render();toast("Aportación guardada");return}
    if(t.id==="bkExport"){await doExport();return}
    if(t.id==="bkCopy"){try{await navigator.clipboard.writeText(exportJSON());sheet.msg="Copia copiada. Pégala en una nota o en un mensaje a ti.";markBackupSilent()}catch(_){sheet.msg="No se pudo copiar. Usa «Guardar copia»."}renderLayer();return}
    if(t.id==="impYes"){const d2=importData;sheet=null;await applyImport(d2);render();toast("Datos importados");return}
    if(t.id==="impNo"){sheet.pendingImport=false;importData=null;renderLayer();return}
    if(t.id==="wipe"){if(!sheet.wipeAsk){sheet.wipeAsk=true;renderLayer();return}S.months={};S.config=Object.assign(DEFAULT_CFG(),{inicializado:false});if(dbh){/* en db no se borra desde aquí */}else lsWrite();sheet=null;lastTotal=null;render();toast("Datos borrados");return}
    return;
  }
  if(sheet.kind!=="mov")return;
  if(d.k!==undefined){keyPress(d.k);return}
  if(d.st){readFields();sheet.t=d.st;sheet.err=null;if(d.st==="i"||d.st==="g")sheet.k=d.st==="i"?"Extras":suggestCat(sheet.c,"g");if(sheet.t!=="g")sheet.cb=false;renderLayer();return}
  if(d.sk){sheet.k=d.sk;sheet.kAuto=false;vib(6);refreshTiles();return}
  if(d.sb){readFields();sheet.b=d.sb;renderLayer();return}
  if(d.sde){sheet.de=d.sde;renderLayer();return}
  if(d.sa){sheet.a=d.sa;renderLayer();return}
  if(d.sd){readFields();if(d.sd==="hoy"){sheet.f=today();sheet.showDate=false}else if(d.sd==="ayer"){sheet.f=yesterday();sheet.showDate=false}else{sheet.showDate=true}renderLayer();return}
  if(t.id==="sCb"){readFields();sheet.cb=!sheet.cb;renderLayer();return}
  if(d.fq!==undefined){
    readFields(); const f=frequent(sheet.t)[+d.fq]; if(f){sheet.c=f.c;sheet.k=f.x.k||suggestCat(f.c,sheet.t);sheet.kAuto=false;if(f.x.b&&BANKS.includes(f.x.b))sheet.b=f.x.b; if(!sheet.m&&f.x.m!=null)sheet.m=String(f.x.m); if(f.x.cb&&sheet.t==="g"&&!f.x.cd)sheet.cb=true} renderLayer();return;
  }
  if(t.id==="sSave"){saveSheet(false);return}
  if(t.id==="sMore"){saveSheet(true);return}
  if(t.id==="sDel"){
    if(!sheet.delAsk){readFields();sheet.delAsk=true;renderLayer();return}
    const id=sheet.id, it=clone(sheet.orig); const k=removeItem(id); sheet=null; await saveMonth(k); render(); toast("Movimiento borrado",async()=>{addItem(it);await saveMonth(ym(it.f));render()}); return;
  }
});
function markBackupSilent(){S.config.backupFecha=today();saveConfig()}
document.addEventListener("input",e=>{
  if(e.target.id==="q"){filt.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");if(q){q.focus();q.setSelectionRange(pos,pos)}}
  if(e.target.id==="sC"&&sheet&&sheet.kind==="mov"){sheet.c=e.target.value;if(sheet.kAuto!==false&&sheet.t!=="t"){sheet.k=suggestCat(e.target.value,sheet.t);refreshTiles()}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="impFile"){handleFile(e.target.files&&e.target.files[0])}
  if(e.target.id==="sF"&&sheet&&sheet.kind==="mov"){sheet.f=e.target.value||sheet.f;readFields();renderLayer()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheet){sheet=null;renderLayer()}
  if(e.key==="Enter"&&sheet&&e.target.tagName==="INPUT"&&e.target.type==="text"){e.preventDefault();
    if(sheet.kind==="mov")saveSheet(false); else if(sheet.kind==="bal")$("#bSave").click(); else if(sheet.kind==="init")$("#iSave").click()}
});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(S.loaded&&tab==="inicio"&&!sheet)render()});

render();
boot();
try{ if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{}) }catch(e){}
})();
</script>
